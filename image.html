<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片与视频展示</title>
    <!-- 禁用右键菜单 -->
    <!-- <script src="./js/limit.js"></script> -->
    
    <!-- 整合的样式 -->
    <style>
        /* 基础样式 */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* 布局样式 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: #666;
        }

        /* 图片和视频容器样式 */
        .image-container, .video-container {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
            background-color: white;
            padding: 10px;
            width: 300px;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            pointer-events: auto;
        }

        .image-container:hover, .video-container:hover {
            transform: scale(1.05);
        }

        /* 图片样式 */
        .image-container img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            display: block;
            pointer-events: none;
            -webkit-user-drag: none;
            -khtml-user-drag: none;
            -moz-user-drag: none;
            -o-user-drag: none;
        }

        /* 视频样式 */
        .video-container video {
            width: 100%;
            height: 400px;
            object-fit: cover;
            display: block;
        }

        /* 名称样式 */
        .image-name, .video-name {
            padding: 8px;
            text-align: center;
            font-size: 14px;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 链接样式 */
        .github-link {
            display: inline-block;
            padding: 10px 20px;
            background-color: #333;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            margin-bottom: 20px;
            transition: background-color 0.3s;
        }

        .github-link:hover {
            background-color: #555;
        }

        /* 加载提示样式 */
        .loading-message {
            width: 100%;
            text-align: center;
            padding: 20px;
            color: #666;
            font-style: italic;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>图片与视频展示</h1>
            <a href="https://simon-mzg.github.io/resources/" target="_blank" rel="noopener noreferrer"
                class="github-link">
                访问 GitHub 资源库
            </a>
        </div>

        <div class="gallery" id="imageGallery">
            <div class="loading-message">正在加载图片...</div>
            <!-- 图片将通过JavaScript动态加载 -->
        </div>

        <div class="gallery" id="videoGallery">
            <div class="loading-message">正在加载视频...</div>
            <!-- 视频将通过JavaScript动态加载 -->
        </div>

        <div class="footer">
            <p>图片与视频展示页面 - 自动加载 image/xz/ 目录下的所有图片和 video/ 目录下的所有视频</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const imageGallery = document.getElementById('imageGallery');
            const videoGallery = document.getElementById('videoGallery');
            const imageDir = 'image/xz';
            const videoDir = 'image/xz'; 

            // 尝试获取目录中的所有图片
            // 注意：由于浏览器安全限制，直接读取本地目录不可行
            // 这里使用几种可能的解决方案

            // 方法1：尝试获取目录索引（如果服务器启用了目录列表）
            fetch(imageDir)
                .then(response => {
                    // 检查响应是否包含HTML（目录列表）
                    const contentType = response.headers.get('content-type');
                    if (contentType && contentType.includes('text/html')) {
                        return response.text();
                    }
                    throw new Error('无法获取目录列表');
                })
                .then(html => {
                    // 解析HTML，提取图片文件名
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    const links = doc.querySelectorAll('a[href$=".png"], a[href$=".jpg"], a[href$=".jpeg"], a[href$=".gif"], a[href$=".webp"]');

                    if (links.length > 0) {
                        // 如果找到图片链接，创建图片元素
                        links.forEach(link => {
                            let href = link.getAttribute('href');
                            // 确保路径正确拼接，避免双斜杠
                            if (href.startsWith('/')) {
                                href = href.substring(1);
                            }
                            // 手动添加斜杠，因为之前已经移除了imageDir的结尾斜杠
                            const imagePath = href;

                            // console.log(imagePath)
                            createImageElement(imagePath, imageGallery);
                        });

                        // 移除加载提示
                        removeLoadingMessage(imageGallery);
                    } else {
                        // 如果没有找到图片，使用备用方案
                        loadFallbackImages(imageGallery);
                    }
                })
                .catch(error => {
                    console.error('加载目录失败:', error);
                    // 使用备用方案
                    loadFallbackImages(imageGallery);
                });

            // 创建图片元素的函数
            function createImageElement(imagePath, gallery) {
                const container = document.createElement('div');
                container.className = 'image-container';

                const img = document.createElement('img');
                img.src = imagePath;
                img.alt = imagePath.split('/').pop(); // 获取文件名作为alt文本

                // 防止右键菜单
                img.oncontextmenu = function () {
                    return false;
                };

                // 防止拖拽
                img.ondragstart = function () {
                    return false;
                };

                // 防止长按保存（移动设备）
                img.ontouchstart = function (e) {
                    e.preventDefault();
                    return false;
                };

                // 防止双击保存
                img.ondblclick = function (e) {
                    e.preventDefault();
                    return false;
                };

                // 防止复制
                img.oncopy = function (e) {
                    e.preventDefault();
                    return false;
                };
                img.onerror = function () {
                    // 如果图片加载失败，隐藏容器
                    container.style.display = 'none';
                    console.warn('无法加载图片:', imagePath);
                };

                const nameDiv = document.createElement('div');
                nameDiv.className = 'image-name';
                // nameDiv.textContent = img.alt;// 图片路径

                container.appendChild(img);
                container.appendChild(nameDiv);
                gallery.appendChild(container);
            }

            // 移除加载提示的函数
            function removeLoadingMessage(gallery) {
                const loadingMessage = gallery.querySelector('.loading-message');
                if (loadingMessage) {
                    loadingMessage.remove();
                }
            }

            // 备用方案：预定义的图片列表
            function loadFallbackImages(gallery) {
                // 移除加载提示
                removeLoadingMessage(gallery);

                const fallbackImages = [
                    'videoframe_2381.png',
                    'o0FzINDnAobAlRRAflPpAbYQOAeb19AtbkCgSg~tplv-dy-aweme-images_q75.png',
                    'oYjs9mACrCtEApaRAAIAWxYf4ejgGFEDAjDCtK~tplv-dy-aweme-images_q75.webp'
                ];

                fallbackImages.forEach(imageName => {
                    // 使用与主逻辑相同的路径拼接方式
                    const imagePath = imageDir + '/' + imageName;
                    createImageElement(imagePath, gallery);
                });

                // 显示提示信息
                const infoDiv = document.createElement('div');
                infoDiv.style.width = '100%';
                infoDiv.style.textAlign = 'center';
                infoDiv.style.marginTop = '20px';
                infoDiv.style.color = '#666';
                infoDiv.textContent = '注意：由于浏览器安全限制，无法直接读取本地目录。显示的是预定义的图片列表。';
                document.querySelector('.container').appendChild(infoDiv);
            }

            // 加载视频
            loadVideos();

            function loadVideos() {
                // 方法1：尝试获取目录索引（如果服务器启用了目录列表）
                fetch(videoDir)
                    .then(response => {
                        // 检查响应是否包含HTML（目录列表）
                        const contentType = response.headers.get('content-type');
                        if (contentType && contentType.includes('text/html')) {
                            return response.text();
                        }
                        throw new Error('无法获取视频目录列表');
                    })
                    .then(html => {
                        // 解析HTML，提取视频文件名
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(html, 'text/html');
                        const links = doc.querySelectorAll('a[href$=".mp4"], a[href$=".webm"], a[href$=".ogg"], a[href$=".avi"], a[href$=".mov"]');

                        if (links.length > 0) {
                            // 如果找到视频链接，创建视频元素
                            links.forEach(link => {
                                let href = link.getAttribute('href');
                                // console.log(href);
                                // 确保路径正确拼接，避免双斜杠
                                if (href.startsWith('/')) {
                                    href = href.substring(1);
                                }
                                // 手动添加斜杠，因为之前已经移除了videoDir的结尾斜杠
                                const videoPath = href;

                                // console.log(videoPath);
                                createVideoElement(videoPath);
                            });

                            // 移除加载提示
                            removeLoadingMessage(videoGallery);
                        } else {
                            // 如果没有找到视频，使用备用方案
                            loadFallbackVideos();
                        }
                    })
                    .catch(error => {
                        console.error('加载视频目录失败:', error);
                        // 使用备用方案
                        loadFallbackVideos();
                    });
            }

            // 创建视频元素的函数
            function createVideoElement(videoPath) {
                const container = document.createElement('div');
                container.className = 'video-container';

                const video = document.createElement('video');
                video.src = videoPath;
                video.controls = true; // 显示视频控制条
                video.preload = 'metadata'; // 预加载元数据

                // 防止右键菜单
                video.oncontextmenu = function () {
                    return false;
                };

                // 防止拖拽
                video.ondragstart = function () {
                    return false;
                };

                // 防止长按保存（移动设备）
                video.ontouchstart = function (e) {
                    e.preventDefault();
                    return false;
                };

                // 防止双击保存
                video.ondblclick = function (e) {
                    e.preventDefault();
                    return false;
                };

                // 防止复制
                video.oncopy = function (e) {
                    e.preventDefault();
                    return false;
                };

                video.onerror = function () {
                    // 如果视频加载失败，隐藏容器
                    container.style.display = 'none';
                    console.warn('无法加载视频:', videoPath);
                };

                const nameDiv = document.createElement('div');
                nameDiv.className = 'video-name';
                nameDiv.textContent = videoPath.split('/').pop(); // 获取文件名作为视频名称

                container.appendChild(video);
                container.appendChild(nameDiv);
                videoGallery.appendChild(container);
            }

            // 备用方案：预定义的视频列表
            function loadFallbackVideos() {
                // 移除加载提示
                removeLoadingMessage(videoGallery);

                const fallbackVideos = [
                    'sample1.mp4',
                    'sample2.mp4',
                    'sample3.mp4'
                ];

                fallbackVideos.forEach(videoName => {
                    // 使用与主逻辑相同的路径拼接方式
                    const videoPath = videoDir + '/' + videoName;
                    createVideoElement(videoPath);
                });

                // 显示提示信息
                const infoDiv = document.createElement('div');
                infoDiv.style.width = '100%';
                infoDiv.style.textAlign = 'center';
                infoDiv.style.marginTop = '20px';
                infoDiv.style.color = '#666';
                infoDiv.textContent = '注意：由于浏览器安全限制，无法直接读取本地目录。显示的是预定义的视频列表。';
                document.querySelector('.container').appendChild(infoDiv);
            }
        });
    </script>
</body>

</html>
